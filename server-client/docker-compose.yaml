version: '3.8'

services:
  db-client-mubarakov:
    image: postgres:15
    container_name: db-client-mubarakov
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: duck
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data        
      - ./_postgresql/:/docker-entrypoint-initdb.d/   


  redis-mubarakov:
    image: redis:7
    container_name: redis-mubarakov
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data:
